<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSGO 开箱风格</title>
  <style>
    :root {
      --bg-1: #121620;
      --bg-2: #0a0c12;
      --panel: #1c2231;
      --line: rgba(255, 255, 255, 0.16);
      --text: #f0f5ff;
      --gold: #f0b24a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: radial-gradient(900px 360px at 50% -60px, rgba(240, 178, 74, 0.12), transparent),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    }

    .hidden {
      display: none !important;
    }

    .intro-screen {
      min-height: 100vh;
      padding: 16px;
      display: grid;
      grid-template-rows: 1fr auto;
      background:
        radial-gradient(1200px 520px at 50% 0, rgba(240, 178, 74, 0.1), transparent 60%),
        linear-gradient(180deg, #141925 0%, #0b0d13 100%);
    }

    .intro-hero {
      width: min(96vw, 1080px);
      margin: 0 auto;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      overflow: hidden;
      background: linear-gradient(180deg, #253041 0%, #10141e 100%);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.45);
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .intro-head {
      text-align: center;
      padding: 16px 12px 8px;
    }

    .intro-head h1 {
      margin: 0;
      color: var(--gold);
      font-size: 34px;
      letter-spacing: 2px;
    }

    .intro-head p {
      margin: 6px 0 0;
      color: rgba(240, 245, 255, 0.75);
      font-size: 15px;
    }

    .crate-stage {
      position: relative;
      margin: 0 14px;
      min-height: 260px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background:
        radial-gradient(500px 260px at 62% 35%, rgba(240, 178, 74, 0.24), transparent 65%),
        linear-gradient(180deg, #2a3548 0%, #141a24 100%);
      overflow: hidden;
    }

    .crate {
      position: absolute;
      left: 50%;
      top: 52%;
      width: min(52vw, 430px);
      aspect-ratio: 16 / 9;
      transform: translate(-50%, -50%) rotate(-8deg);
      border-radius: 14px;
      border: 2px solid rgba(23, 20, 8, 0.5);
      background: linear-gradient(180deg, #ffd557, #f0b21e);
      box-shadow: 0 18px 32px rgba(0, 0, 0, 0.35);
    }

    .crate::before {
      content: "";
      position: absolute;
      inset: 12% 7%;
      border: 3px solid rgba(84, 62, 12, 0.35);
      border-radius: 8px;
    }

    .crate::after {
      content: "MANGO CASE";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: #2f2510;
      font-weight: 800;
      font-size: clamp(18px, 2.7vw, 34px);
      letter-spacing: 1px;
    }

    .intro-items {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(16, 21, 30, 0.88);
      padding: 10px 12px 12px;
      display: grid;
      grid-template-columns: repeat(8, minmax(92px, 1fr));
      gap: 8px;
    }

    .intro-item {
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: linear-gradient(180deg, #3d4450, #2a2f38);
      min-height: 56px;
      position: relative;
    }

    .intro-item::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      background: linear-gradient(90deg, #4e83ff, #6aa2ff);
    }

    .intro-item.r2::after { background: linear-gradient(90deg, #8f68ff, #a78eff); }
    .intro-item.r3::after { background: linear-gradient(90deg, #d061da, #e68df0); }
    .intro-item.r4::after { background: linear-gradient(90deg, #e9b63f, #ffd973); }

    .intro-actions {
      display: flex;
      justify-content: center;
      padding: 14px 0 2px;
    }

    .case-panel {
      width: min(96vw, 980px);
      border-radius: 18px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.45);
      padding: 22px 18px 18px;
      margin: 24px auto;
    }

    .title {
      margin: 0 0 6px;
      text-align: center;
      font-size: 30px;
      letter-spacing: 1px;
      color: var(--gold);
      text-transform: uppercase;
    }

    .subtitle {
      margin: 0 0 16px;
      text-align: center;
      color: rgba(240, 245, 255, 0.72);
      font-size: 14px;
    }

    .roulette-wrap {
      border-radius: 12px;
      padding: 10px;
      border: 1px solid rgba(240, 178, 74, 0.28);
      background: linear-gradient(180deg, rgba(240, 178, 74, 0.08), rgba(0, 0, 0, 0.26));
      position: relative;
    }

    .roulette {
      width: 100%;
      height: 150px;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: linear-gradient(180deg, #1e2535 0%, #171d2a 100%);
      position: relative;
    }

    .track {
      position: absolute;
      top: 50%;
      left: 0;
      display: flex;
      gap: 10px;
      transform: translate3d(0, -50%, 0);
      will-change: transform;
    }

    .skin {
      width: 170px;
      height: 118px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      flex: 0 0 auto;
      box-shadow: inset 0 -24px 28px rgba(0, 0, 0, 0.26), 0 8px 14px rgba(0, 0, 0, 0.24);
      position: relative;
      overflow: hidden;
      display: grid;
      align-content: end;
      padding: 8px;
    }

    .skin::before {
      content: "MANGO";
      position: absolute;
      top: 7px;
      left: 8px;
      font-size: 11px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.75);
      font-weight: 600;
    }

    .skin-name {
      position: relative;
      z-index: 1;
      font-size: 14px;
      font-weight: 700;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.35);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .skin-rarity {
      margin-top: 2px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.86);
    }

    .common { background: linear-gradient(180deg, #66a2ff, #305ac7); }
    .uncommon { background: linear-gradient(180deg, #9f8cff, #5d48d4); }
    .rare { background: linear-gradient(180deg, #ff91db, #c84ca4); }
    .epic { background: linear-gradient(180deg, #ff9a6b, #d76a2b); }
    .legendary { background: linear-gradient(180deg, #ffd369, #d8a123); }

    .pointer {
      position: absolute;
      top: 6px;
      bottom: 6px;
      left: 50%;
      width: 5px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,233,186,0.95), rgba(255,255,255,0));
      filter: drop-shadow(0 0 8px rgba(255, 220, 150, 0.82));
      pointer-events: none;
    }

    .result {
      min-height: 28px;
      margin: 12px 0 0;
      text-align: center;
      color: #ffe6bf;
      font-size: 15px;
    }

    .draw-btn {
      width: min(360px, 100%);
      display: block;
      margin-left: auto;
      margin-right: auto;
      margin-top: 8px;
      height: 50px;
      border-radius: 14px;
      border: 1px solid rgba(255, 197, 112, 0.86);
      background: linear-gradient(180deg, #f5b13b 0%, #db8e0f 100%);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.35);
      box-shadow: 0 10px 18px rgba(219, 142, 15, 0.32);
    }

    .draw-btn[disabled] {
      cursor: not-allowed;
      opacity: 0.72;
    }

    @media (max-width: 680px) {
      .skin {
        width: 132px;
        height: 110px;
      }
      .track { gap: 8px; }
    }
  </style>
</head>
<body>
  <section class="intro-screen" id="introScreen">
    <div class="intro-hero">
      <div class="intro-head">
        <h1>开箱</h1>
        <p>解锁反冲武器箱 · 首次进入请先预览奖励池</p>
      </div>
      <div class="crate-stage">
        <div class="crate" aria-hidden="true"></div>
      </div>
      <div class="intro-items" aria-hidden="true">
        <div class="intro-item"></div><div class="intro-item"></div><div class="intro-item"></div><div class="intro-item"></div>
        <div class="intro-item r2"></div><div class="intro-item r2"></div><div class="intro-item r3"></div><div class="intro-item r4"></div>
      </div>
    </div>
    <div class="intro-actions">
      <button class="draw-btn" id="enterCaseBtn" type="button">开启并查看掉落</button>
    </div>
  </section>

  <main class="case-panel hidden" id="casePanel">
    <h1 class="title">MANGO CASE OPENING</h1>
    <p class="subtitle">CSGO 风格开箱：物品持续滚动，点击后抽取一个奖励</p>
    <section class="roulette-wrap">
      <div class="roulette" id="roulette">
        <div class="track" id="track"></div>
      </div>
      <div class="pointer"></div>
    </section>
    <p class="result" id="resultText">开箱轨道已启动，点击“开启武器箱”</p>
    <button class="draw-btn" id="drawBtn" type="button">开启武器箱</button>
  </main>

  <script>
    (function () {
      var drawBtn = document.getElementById("drawBtn");
      var resultText = document.getElementById("resultText");
      var roulette = document.getElementById("roulette");
      var track = document.getElementById("track");
      var introScreen = document.getElementById("introScreen");
      var casePanel = document.getElementById("casePanel");
      var enterCaseBtn = document.getElementById("enterCaseBtn");

      var pool = [
        { label: "AK-47 | 赤红新星", rarity: "军规级", cls: "common" },
        { label: "M4A1-S | 夜幕", rarity: "受限级", cls: "uncommon" },
        { label: "AWP | 极光闪击", rarity: "保密级", cls: "rare" },
        { label: "USP-S | 霓虹矩阵", rarity: "隐秘级", cls: "epic" },
        { label: "蝴蝶刀 | 日珥", rarity: "金色稀有", cls: "legendary" },
        { label: "沙鹰 | 硝烟", rarity: "军规级", cls: "common" },
        { label: "格洛克 | 金属波纹", rarity: "受限级", cls: "uncommon" },
        { label: "P90 | 量子裂缝", rarity: "保密级", cls: "rare" }
      ];

      var base = [];
      for (var i = 0; i < 4; i++) base = base.concat(pool);

      track.innerHTML = base.map(function (item) {
        return '<div class="skin ' + item.cls + '" title="' + item.label + '">' +
          '<div class="skin-name">' + item.label + '</div>' +
          '<div class="skin-rarity">' + item.rarity + '</div>' +
          '</div>';
      }).join("");

      var itemWidth = window.innerWidth <= 680 ? 140 : 180; // 卡片宽 + gap
      var cycleCount = pool.length;
      var cycleWidth = itemWidth * cycleCount;
      var position = 0;
      var speed = 92; // 像素/秒
      var isDrawing = false;
      var lastTs = performance.now();

      function mod(n, m) {
        return ((n % m) + m) % m;
      }

      function render() {
        var x = -mod(position, cycleWidth) - cycleWidth;
        track.style.transform = "translate3d(" + x + "px, -50%, 0)";
      }

      function tick(ts) {
        var dt = (ts - lastTs) / 1000;
        lastTs = ts;
        position += speed * dt;
        render();
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function spinToRandomResult() {
        if (isDrawing) return;
        isDrawing = true;
        drawBtn.disabled = true;
        resultText.textContent = "开箱中...";

        var targetIndex = Math.floor(Math.random() * cycleCount);
        var currentInCycle = mod(position, cycleWidth);
        var targetCenter = targetIndex * itemWidth + itemWidth / 2;
        var forwardInCycle = mod(targetCenter - currentInCycle, cycleWidth);
        var extraLoops = 5 + Math.floor(Math.random() * 3);
        var totalDistance = extraLoops * cycleWidth + forwardInCycle;

        var startPos = position;
        var duration = 3600;
        var startAt = performance.now();

        function animate(now) {
          var p = Math.min(1, (now - startAt) / duration);
          var e = easeOutCubic(p);
          position = startPos + totalDistance * e;
          render();
          if (p < 1) {
            requestAnimationFrame(animate);
            return;
          }
          speed = 58; // 回到持续滚动
          speed = 92;
          isDrawing = false;
          drawBtn.disabled = false;
          resultText.textContent = "恭喜获得：" + pool[targetIndex].label + "（" + pool[targetIndex].rarity + "）";
        }

        requestAnimationFrame(animate);
      }

      drawBtn.addEventListener("click", spinToRandomResult);

      enterCaseBtn.addEventListener("click", function () {
        introScreen.classList.add("hidden");
        casePanel.classList.remove("hidden");
      });
    })();
  </script>
</body>
</html>
