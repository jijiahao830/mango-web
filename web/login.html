<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="media/photos/index/logo/logo2.webp">

  <title>芒果超跑 · 专属认证</title>
  <link rel="stylesheet" href="./login.css">
  <script src="./members.js"></script>
  <!-- 若用 Live Server、其它端口或 file:// 打开本页，请填写会员 API 根地址（与 python member_api.py 一致），例如 http://127.0.0.1:8765 -->
  <script>window.MANGO_API_ORIGIN = "";</script>
</head>
<body>
  <div class="login-container">
    <!-- 背景光效与颗粒感 -->
    <div class="bg-fx"></div>
    <div class="bg-noise"></div>
    
    <div class="login-card animate-in">
      <div class="brand-header">
        <img src="media/photos/index/logo/logo2-1.webp" alt="芒果超跑" class="login-logo">
        <h2 class="login-title">DRIVER IDENTIFICATION</h2>
        <p class="login-subtitle">请输入您的尊贵姓名，启动超跑之旅</p>
      </div>
      
      <form class="login-form" id="loginForm">
        <div class="input-group">
          <input type="text" id="driverName" name="name" required autocomplete="off" placeholder=" ">
          <label for="driverName">会员姓名</label>
          <div class="input-glow"></div>
        </div>
        
        <button type="submit" class="btn-engine-start">
          <span class="btn-text">ENGINE START</span>
          <span class="btn-fx"></span>
        </button>
      </form>
    </div>
    
    <!-- 认证成功后的信息卡片 -->
    <div class="welcome-cards" id="welcomeCards" style="display: none;">
      <!-- 与卡片同色的固定衬垫，切换动画中途不会透出页面背景 -->
      <div class="welcome-cards__backdrop" aria-hidden="true"></div>

      <!-- 第二个卡片 (叠在下面) -->
      <div class="welcome-card empty-card" id="card2">
        <div class="empty-placeholder"></div>
        <p style="color: rgba(255,255,255,0.5); margin-top: 20px;">敬请期待更多专属权益</p>
        <!-- 暂时在这个卡片里放个进入首页的按钮，或者等几秒自动跳转 -->
        <button class="btn-enter-garage" id="enterGarageBtn" style="margin-top: 30px; display: none;">进入专属车库</button>
      </div>

      <!-- 第一个卡片 (叠在上面) -->
      <div class="welcome-card active-card" id="card1">
        <div class="welcome-icon">👑</div>
        <div class="welcome-content" id="welcomeMessage">
          <!-- 内容将通过 JS 动态生成 -->
        </div>
        <!-- 点击进入下一张卡片的箭头 -->
        <div class="next-card-btn" id="nextCardBtn">
          <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
      </div>
      
    </div>
  </div>

  <script src="./login.js"></script>
</body>
</html>
