<!doctype html>
<html lang="zh-CN">
<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>芒果超跑 · 专属认证</title>
  <link rel="stylesheet" href="./login.css?v=1777792097410">
  <script src="./members.js?v=1777792097410"></script>
  <script>window.MANGO_API_ORIGIN = "";</script>
</head>
<body>
  <div class="login-container">
    <div class="bg-fx"></div>
    <div class="bg-noise"></div>

    <div class="login-card animate-in">
      <div class="brand-header">
        <img src="media-webp/photos/index/logo/logo2-1.webp" alt="芒果超跑" class="login-logo">
        <h2 class="login-title">DRIVER IDENTIFICATION</h2>
        <p class="login-subtitle">请输入您的尊贵姓名，启动超跑之旅</p>
      </div>

      <form class="login-form" id="loginForm">
        <div class="input-group">
          <input type="text" id="driverName" name="name" required autocomplete="off" placeholder=" ">
          <label for="driverName">会员姓名</label>
          <div class="input-glow"></div>
        </div>

        <button type="submit" class="btn-engine-start">
          <span class="btn-text">ENGINE START</span>
          <span class="btn-fx"></span>
        </button>
      </form>
    </div>

    <div class="welcome-cards" id="welcomeCards" style="display: none;">
      <div class="welcome-cards__backdrop" aria-hidden="true"></div>
      <div class="welcome-card active-card" id="card1">
        <div class="welcome-board">
          <div class="welcome-header">
            <div class="welcome-topline">
              <img src="media-webp/photos/index/logo/logo2.webp" alt="" class="welcome-heading__logo" loading="lazy" decoding="async">
              <div id="welcomeMessage"></div>
            </div>
          </div>
          <div class="welcome-list-container">
            <div class="welcome-list-row welcome-row-tl" id="row-mango-pai">
              <div class="welcome-list-title">芒果π</div>
              <div class="welcome-list-content" id="grid-mango-pai"></div>
            </div>
            <div class="welcome-list-row welcome-row-tr" id="row-mango-qing">
              <div class="welcome-list-title">青芒π</div>
              <div class="welcome-list-content" id="grid-mango-qing"></div>
            </div>
            <div class="welcome-list-row welcome-row-bl" id="row-mango-jin">
              <div class="welcome-list-title">金芒π</div>
              <div class="welcome-list-content" id="grid-mango-jin"></div>
            </div>
            <div class="welcome-list-row welcome-row-br" id="row-mango-hei">
              <div class="welcome-list-title">黑芒π</div>
              <div class="welcome-list-content" id="grid-mango-hei"></div>
            </div>
          </div>
          <div class="welcome-footer">
            <button type="button" class="welcome-next-btn" id="nextCardBtn">开启专属车库</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./device-redirect.js?v=1777792097410"></script>
  <script src="./login.js?v=1777792097410"></script>
</body>
</html>
