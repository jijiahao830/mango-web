  /* 须早于 body 开屏节点：file:// 下 index.js 在文末才执行，否则动画已播放 */
  (function () {
    function wantSkip() {
      try {
        var sp = new URLSearchParams(String(location.search || '').replace(/^\?/, ''));
        var q = String(sp.get('m2ns') || '').toLowerCase();
        if (q === '1' || q === 'true' || q === 'yes') return true;
        var fh = String(location.hash || '').replace(/^#/, '');
        if (/--m2ns$/i.test(fh)) return true;
        if (String(sessionStorage.getItem('m2_skip_next_index_splash') || '') === '1') return true;
        if (fh.indexOf('&') === -1) return false;
        var segs = fh.split('&');
        for (var i = 1; i < segs.length; i++) {
          var seg = segs[i];
          var eq = seg.indexOf('=');
          var k = String(eq === -1 ? seg : seg.slice(0, eq))
            .trim()
            .toLowerCase();
          var v = String(eq === -1 ? '' : seg.slice(eq + 1))
            .trim()
            .toLowerCase();
          if (k === 'm2ns' && (v === '1' || v === 'true' || v === 'yes' || v === '')) return true;
        }
      } catch (e) {}
      return false;
    }
    if (wantSkip()) {
      document.documentElement.classList.add('m2-splash-suppressed');
      try {
        window.__m2SkipSplashEarly = true;
      } catch (e2) {}
    }
  })();
  </script>
  <script>
  /* 开屏阶段即拉取车型目录（与 index.js loadCatalog 同源策略一致，结果供 loadCatalog 复用） */
  (function () {
    function apiBases() {
      var list = [];
      function add(u) {
        u = String(u || '').replace(/\/$/, '');
        if (!u || list.indexOf(u) !== -1) return;
        list.push(u);
      }
      try {
        var sp = new URLSearchParams(String(location.search || '').replace(/^\?/, ''));
        var q = String(sp.get('m2api') || '').trim();
        if (q) add(q);
      } catch (eQ) {}
      try {
        if (typeof window !== 'undefined' && window.MANGO_API_ORIGIN) {
          add(String(window.MANGO_API_ORIGIN));
        }
      } catch (e0) {}
      var origin = String(location.origin || '').replace(/\/$/, '');
      if (origin && origin !== 'null' && origin.indexOf('file:') !== 0) {
        add(origin);
        try {
          var h = String(location.hostname || '').toLowerCase();
          if (h === 'localhost' || h === '127.0.0.1') {
            add('http://127.0.0.1:8765');
            add('http://127.0.0.1:8787');
          } else if (/^\d+\.\d+\.\d+\.\d+$/.test(h)) {
            add('http://' + h + ':8765');
            add('http://' + h + ':8787');
          }
        } catch (e1) {}
      } else {
        add('https://www.mangov8.com');
        add('http://127.0.0.1:8765');
        add('http://localhost:8765');
        add('http://127.0.0.1:8787');
        add('http://localhost:8787');
      }
      add('https://www.mangov8.com');
      return list.length ? list : ['https://www.mangov8.com'];
    }
    function fetchOne(base) {
      return fetch(base + '/api/cars-catalog', { credentials: 'omit' }).then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok || !j || !j.ok || !Array.isArray(j.cars)) throw new Error('invalid cars-catalog');
          return j.cars;
        });
      });
    }
    var bases = apiBases();
    var i = 0;
    function folderForBanner(carName) {
      var raw = String(carName || '').trim();
      if (!raw) return '';
      var compact = raw.replace(/[\s\u00a0\u3000]+/g, ' ').trim();
      var alias = {
        '兰博基尼 V12 大牛 LP750-4 SV': '兰博基尼 LP750-4 SV',
        '兰博基尼V12 大牛 LP750-4 SV': '兰博基尼 LP750-4 SV',
      };
      return alias[compact] || compact;
    }
    function preloadFirstBanners(cars) {
      if (!cars || !cars.length) return;
      var n = Math.min(5, cars.length);
      for (var k = 0; k < n; k++) {
        var nm = String((cars[k] && cars[k].car_name) || '').trim();
        if (!nm) continue;
        var folder = encodeURIComponent(folderForBanner(nm));
        var img = new Image();
        img.src='../media-webp/photos/carpark/' + folder + '/详情页-banner.webp';
      }
    }
    function next() {
      if (i >= bases.length) return;
      var base = bases[i++];
      fetchOne(base)
        .then(function (cars) {
          window.__m2PrefetchedCatalog = cars;
          try {
            preloadFirstBanners(cars);
          } catch (e) {}
        })
        .catch(function () {
          next();
        });
    }
    next();
  })();
  </script>

  (function () {
    var ver = String(typeof window.__MANGO_ASSET_VERSION__ !== 'undefined' ? window.__MANGO_ASSET_VERSION__ : '').trim();
    var activityHref = ver ? './activity.html?v=' + encodeURIComponent(ver) : './activity.html';
    ['m2ChooserAdCta', 'm2BtnActivity'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el && el.tagName === 'A') el.setAttribute('href', activityHref);
    });

    var ad = document.getElementById('m2ChooserAd');
    var adImg = document.getElementById('m2ChooserAdImage');
    var adCta = document.getElementById('m2ChooserAdCta');
    var closeBtn = document.getElementById('m2ChooserAdClose');
    if (!ad || !closeBtn || !adImg || !adCta) return;
    var KEY = 'm2ChooserAdDismissed';
    var adScrollLocked = false;

    function lockAdScroll() {
      if (adScrollLocked) return;
      adScrollLocked = true;
      try {
        if (typeof window.m2aLockOverlayScroll === 'function') {
          window.m2aLockOverlayScroll();
          return;
        }
      } catch (eLock) {}
      try {
        var home = document.querySelector('.m2-home');
        if (home) home.classList.add('m2-scroll-lock');
      } catch (eHomeLock) {}
    }

    function unlockAdScroll() {
      if (!adScrollLocked) return;
      adScrollLocked = false;
      try {
        if (typeof window.m2aUnlockOverlayScroll === 'function') {
          window.m2aUnlockOverlayScroll();
          return;
        }
      } catch (eUnlock) {}
      try {
        var home = document.querySelector('.m2-home');
        if (home) home.classList.remove('m2-scroll-lock');
      } catch (eHomeUnlock) {}
    }

    function navType() {
      try {
        var nav = performance.getEntriesByType && performance.getEntriesByType('navigation');
        if (nav && nav[0] && nav[0].type) return nav[0].type;
      } catch (e) {}
      return '';
    }

    function isFromRootLandingPage() {
      try {
        var ref = String(document.referrer || '').trim();
        if (!ref) return false;
        var u = new URL(ref);
        if (u.origin !== location.origin) return false;
        var p = String(u.pathname || '').toLowerCase();
        if (/\/index\.html$/i.test(p)) return true;
        if (p === '/' || p === '') return true;
        return false;
      } catch (e) {
        return false;
      }
    }

    function isReferrerM2ActivityPage() {
      try {
        var ref = String(document.referrer || '').trim();
        if (!ref) return false;
        var u = new URL(ref);
        if (u.origin !== location.origin) return false;
        var p = String(u.pathname || '').toLowerCase();
        return /\/m2\/activity\.html$/i.test(p);
      } catch (e) {
        return false;
      }
    }

    var dismissed = false;
    try {
      dismissed = sessionStorage.getItem(KEY) === '1';
    } catch (e) {}

    /* 刷新：重新展示广告 */
    if (navType() === 'reload') {
      try {
        sessionStorage.removeItem(KEY);
      } catch (e) {}
      dismissed = false;
    } else if (isFromRootLandingPage()) {
      /* 从站点首页进入 m2：重新展示广告 */
      try {
        sessionStorage.removeItem(KEY);
      } catch (e) {}
      dismissed = false;
    } else if (isReferrerM2ActivityPage()) {
      /* 从活动页返回：不再展示广告 */
      dismissed = true;
      try {
        sessionStorage.setItem(KEY, '1');
      } catch (e) {}
    }

    if (dismissed) {
      ad.classList.add('is-hidden');
    } else {
      lockAdScroll();
    }

    function dismissAd() {
      if (dismissed) return;
      dismissed = true;
      try {
        sessionStorage.setItem(KEY, '1');
      } catch (e) {}
      ad.classList.add('is-hidden');
      unlockAdScroll();
    }

    closeBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      dismissAd();
    });

    adCta.addEventListener('click', function () {
      dismissAd();
    });

    window.addEventListener('pageshow', function () {
      try {
        if (sessionStorage.getItem(KEY) === '1') {
          dismissed = true;
          ad.classList.add('is-hidden');
          unlockAdScroll();
        } else if (!ad.classList.contains('is-hidden')) {
          dismissed = false;
          lockAdScroll();
        }
      } catch (e) {}
    });
  })();
  </script>
  <script>
  (function () {
    var cover = document.getElementById('m2ChooserIntroCover');
    if (!cover) return;
    var KEY_CYCLE = 'm2ChooserIntroCycle';
    var KEY_DISMISSED = 'm2ChooserIntroDismissedCycle';
    var cycle = '';
    var dismissed = '';
    var done = false;

    function isFromIndexHtml() {
      try {
        var ref = String(document.referrer || '').trim();
        if (!ref) return false;
        var u = new URL(ref);
        var p = String(u.pathname || '').toLowerCase();
        if (/\/index\.html$/.test(p)) return true;
        if (p === '/' || p === '') return true;
        return false;
      } catch (e) {
        return false;
      }
    }

    function isFromActivityPage() {
      try {
        var ref = String(document.referrer || '').trim();
        if (!ref) return false;
        var u = new URL(ref);
        var p = String(u.pathname || '').toLowerCase();
        return /\/m2\/activity\.html$/i.test(p);
      } catch (e) {
        return false;
      }
    }

    try {
      cycle = String(sessionStorage.getItem(KEY_CYCLE) || '').trim();
      dismissed = String(sessionStorage.getItem(KEY_DISMISSED) || '').trim();
      if (isFromIndexHtml()) {
        cycle = String(Date.now());
        sessionStorage.setItem(KEY_CYCLE, cycle);
        sessionStorage.removeItem(KEY_DISMISSED);
        dismissed = '';
      }
    } catch (e) {}

    if (!cycle || dismissed === cycle || isFromActivityPage()) {
      done = true;
      cover.classList.add('is-hidden');
      return;
    }

    function hideCover() {
      if (done) return;
      done = true;
      try {
        sessionStorage.setItem(KEY_DISMISSED, cycle);
      } catch (e) {}
      cover.classList.add('is-fading');
      setTimeout(function () {
        cover.classList.add('is-hidden');
      }, 460);
    }
    cover.addEventListener('click', hideCover);
    cover.addEventListener('touchend', hideCover, { passive: true });
  })();
  </script>
  <script>
  /* ===== 筛选面板 ===== */
  (function () {
    var mask    = document.getElementById('m2FilterMask');
    var sheet   = document.getElementById('m2FilterSheet');
    var filterBtn = document.getElementById('m2BtnFilter');
    var searchEl  = document.getElementById('m2FilterSearch');
    var catsEl    = document.getElementById('m2FilterCats');
    var brandsEl  = document.getElementById('m2FilterBrands');
    var resetBtn  = document.getElementById('m2FilterReset');
    var confirmBtn = document.getElementById('m2FilterConfirm');

    if (!mask || !sheet || !filterBtn) return;

    var selCat = '';
    var selBrand = '';

    function open() {
      var chooser = window.m2Chooser;
      if (!chooser) return;
      selCat   = chooser.getActiveCategory();
      selBrand = chooser.getActiveBrand();
      renderCats(chooser.getCars(), '');
      renderBrands(chooser.getCars(), selCat, '');
      var becomingOpen = !mask.classList.contains('is-open');
      if (becomingOpen) {
        try {
          if (typeof window.m2aLockOverlayScroll === 'function') window.m2aLockOverlayScroll();
        } catch (eLock) {}
      }
      mask.classList.add('is-open');
      sheet.classList.add('is-open');
      searchEl.value = '';
    }

    function close() {
      var wasOpen = mask.classList.contains('is-open');
      mask.classList.remove('is-open');
      sheet.classList.remove('is-open');
      if (wasOpen) {
        try {
          if (typeof window.m2aUnlockOverlayScroll === 'function') window.m2aUnlockOverlayScroll();
        } catch (eUnlock) {}
      }
    }

    function uniqueVals(cars, key) {
      var seen = Object.create(null);
      var result = [];
      cars.forEach(function (c) {
        var v = String(c[key] || '').trim();
        if (v && !seen[v]) { seen[v] = true; result.push(v); }
      });
      return result.sort(function (a, b) { return a.localeCompare(b, 'zh-Hans-CN'); });
    }

    function renderCats(cars, search) {
      var cats = uniqueVals(cars, 'category');
      if (search) cats = cats.filter(function (c) { return c.indexOf(search) !== -1; });
      catsEl.innerHTML = cats.map(function (c) {
        return '<button class="m2-filter-tag' + (c === selCat ? ' is-active' : '') +
          '" data-cat="' + escHtml(c) + '">' + escHtml(c) + '</button>';
      }).join('');
    }

    function renderBrands(cars, cat, search) {
      var filtered = cat ? cars.filter(function (c) { return String(c.category || '').trim() === cat; }) : cars;
      var brands = uniqueVals(filtered, 'brand');
      if (search) brands = brands.filter(function (b) { return b.indexOf(search) !== -1; });
      brandsEl.innerHTML = brands.map(function (b) {
        return '<button class="m2-filter-tag' + (b === selBrand ? ' is-active' : '') +
          '" data-brand="' + escHtml(b) + '">' + escHtml(b) + '</button>';
      }).join('');
    }

    function escHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
    }

    /* 搜索：按车名/品牌/分类过滤 */
    searchEl.addEventListener('input', function () {
      var q = searchEl.value.trim();
      var cars = window.m2Chooser ? window.m2Chooser.getCars() : [];
      var filtered = q ? cars.filter(function (c) {
        return (c.car_name || '').indexOf(q) !== -1 ||
               (c.brand || '').indexOf(q) !== -1 ||
               (c.category || '').indexOf(q) !== -1;
      }) : cars;
      renderCats(filtered, '');
      renderBrands(filtered, selCat, '');
    });

    /* 点击分类标签：切换高亮，品牌列表按当前搜索结果重新渲染 */
    catsEl.addEventListener('click', function (e) {
      var btn = e.target.closest('.m2-filter-tag');
      if (!btn) return;
      selCat = btn.dataset.cat;
      selBrand = '';
      catsEl.querySelectorAll('.m2-filter-tag').forEach(function (b) {
        b.classList.toggle('is-active', b.dataset.cat === selCat);
      });
      /* 品牌列表按当前搜索词过滤 */
      var q = searchEl.value.trim();
      var cars = window.m2Chooser ? window.m2Chooser.getCars() : [];
      var filtered = q ? cars.filter(function (c) {
        return (c.car_name || '').indexOf(q) !== -1 ||
               (c.brand || '').indexOf(q) !== -1 ||
               (c.category || '').indexOf(q) !== -1;
      }) : cars;
      renderBrands(filtered, selCat, '');
    });

    /* 点击品牌标签：只切换高亮，不重新渲染列表 */
    brandsEl.addEventListener('click', function (e) {
      var btn = e.target.closest('.m2-filter-tag');
      if (!btn) return;
      selBrand = btn.dataset.brand;
      brandsEl.querySelectorAll('.m2-filter-tag').forEach(function (b) {
        b.classList.toggle('is-active', b.dataset.brand === selBrand);
      });
    });

    /* 重置 */
    resetBtn.addEventListener('click', function () {
      selCat = '';
      selBrand = '';
      searchEl.value = '';
      var cars = window.m2Chooser ? window.m2Chooser.getCars() : [];
      renderCats(cars, '');
      renderBrands(cars, '', '');
      if (window.m2Chooser) window.m2Chooser.applyFilter('', '', '');
      close();
    });

    /* 确认 */
    confirmBtn.addEventListener('click', function () {
      if (window.m2Chooser) window.m2Chooser.applyFilter(selCat, selBrand, searchEl.value.trim());
      close();
    });

    filterBtn.addEventListener('click', open);
    mask.addEventListener('click', close);
  })();
  </script>
  <script>
  (function () {
    var PKG_STORAGE = 'm2PkgKey';

    var track = document.getElementById('m2PkgTrack');
    var bg = document.getElementById('m2PkgBg');
    if (!track || !bg) return;

    var items = Array.from(track.querySelectorAll('.m2-packages__item'));
    if (!items.length) return;

    var currentImg = '';
    var activePkgIndex = 0;
    var switchTimer = null;
    var FADE_MS = 200;

    function applyBg(img) {
      if (!img || img === currentImg) return;
      currentImg = img;
      bg.classList.add('is-fading');
      if (switchTimer) clearTimeout(switchTimer);
      switchTimer = setTimeout(function () {
        bg.style.backgroundImage = 'url("' + img + '")';
        bg.classList.remove('is-fading');
        switchTimer = null;
      }, FADE_MS);
    }

    function applyItem(el) {
      if (!el) return;
      var idx = items.indexOf(el);
      if (idx >= 0) activePkgIndex = idx;
      applyBg(el.getAttribute('data-pkg-img') || '');
      if (btn) {
        btn.href = el.getAttribute('data-pkg-href') || '#';
        btn.dataset.pkgKey = el.getAttribute('data-pkg-key') || '';
      }
    }

    var btn = document.getElementById('m2PkgBtn');

    /* 初始背景 */
    var firstImg = items[0].getAttribute('data-pkg-img') || '';
    bg.style.backgroundImage = 'url("' + firstImg + '")';
    currentImg = firstImg;

    /* 初始按钮链接 */
    if (btn && items[0]) {
      btn.href = items[0].getAttribute('data-pkg-href') || '#';
      btn.dataset.pkgKey = items[0].getAttribute('data-pkg-key') || '';
    }

    function readSavedPkgKey() {
      try {
        var q = new URLSearchParams(location.search || '');
        var fromUrl = String(q.get('pkg') || '').trim();
        if (fromUrl) return fromUrl;
        var hasChooser = q.has('cat') || q.has('brand') || q.has('search') || q.has('carIndex');
        /* 有选车参数且当前不是套餐区块时，不读 session，避免与详情返回抢选车区 */
        if (hasChooser) {
          var h = String(location.hash || '').replace(/^#/, '');
          try {
            h = decodeURIComponent(h).trim();
          } catch (e0) {}
          if (!/^m2packages$/i.test(h)) return '';
        }
      } catch (e) {}
      try {
        return String(sessionStorage.getItem(PKG_STORAGE) || '').trim();
      } catch (e) {
        return '';
      }
    }

    function persistPkgKey(key) {
      var k = String(key || '').trim();
      if (!k) return;
      try {
        sessionStorage.setItem(PKG_STORAGE, k);
      } catch (e) {}
    }

    function itemByKey(key) {
      var k = String(key || '').trim();
      if (!k) return null;
      for (var i = 0; i < items.length; i++) {
        if (items[i].getAttribute('data-pkg-key') === k) return items[i];
      }
      return null;
    }

    /** 仅当用户明确回到套餐区（URL 带 pkg 或 #m2Packages）时才滚动页面；仅有 session 记忆时不滚，避免从首页进选车却落在套餐区 */
    function shouldScrollPageToPackages() {
      try {
        var q = new URLSearchParams(location.search || '');
        if (String(q.get('pkg') || '').trim()) return true;
      } catch (e) {}
      var h = String(location.hash || '').replace(/^#/, '');
      try {
        h = decodeURIComponent(h).trim();
      } catch (e0) {}
      return /^m2packages$/i.test(h);
    }

    function restoreSavedPkg() {
      if (window.m2HomeHashSkipsPkgRestore && window.m2HomeHashSkipsPkgRestore()) return;
      var key = readSavedPkgKey();
      var el = itemByKey(key);
      if (!el) return;
      persistPkgKey(key);
      function doScroll() {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        try {
          el.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'auto' });
        } catch (e) {}
        applyItem(el);
      }
      if (!shouldScrollPageToPackages()) {
        applyItem(el);
        return;
      }
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          doScroll();
          setTimeout(doScroll, 0);
          setTimeout(doScroll, 80);
        });
      });
    }

    function hrefFileName(href) {
      var s = String(href || '').trim().replace(/[?#].*$/, '');
      var parts = s.split('/').filter(Boolean);
      return parts.length ? parts[parts.length - 1] : '';
    }

    function persistFromBtn() {
      if (!btn) return;
      var hRaw = String(btn.getAttribute('href') || '').trim();
      var hResolved = '';
      try {
        hResolved = String(btn.href || '');
      } catch (e) {}
      var tail = hrefFileName(hRaw) || hrefFileName(hResolved);
      for (var i = 0; i < items.length; i++) {
        var href = String(items[i].getAttribute('data-pkg-href') || '').trim();
        if (href && (href === hRaw || href === hResolved)) {
          persistPkgKey(items[i].getAttribute('data-pkg-key'));
          return;
        }
        if (tail && hrefFileName(href) === tail) {
          persistPkgKey(items[i].getAttribute('data-pkg-key'));
          return;
        }
      }
      persistPkgKey(btn.dataset.pkgKey || '');
    }

    if (btn) {
      btn.addEventListener('pointerdown', persistFromBtn, { passive: true });
      btn.addEventListener('click', persistFromBtn);
    }

    track.addEventListener('pointerdown', function (e) {
      var item = e.target && e.target.closest ? e.target.closest('.m2-packages__item') : null;
      if (!item) return;
      var key = String(item.getAttribute('data-pkg-key') || '').trim();
      if (key) persistPkgKey(key);
    }, { passive: true });

    track.addEventListener('click', function (e) {
      var item = e.target && e.target.closest ? e.target.closest('.m2-packages__item') : null;
      if (!item) return;
      var href = String(item.getAttribute('data-pkg-href') || '').trim();
      if (!href || href === '#') return;
      e.preventDefault();
      var key = String(item.getAttribute('data-pkg-key') || '').trim();
      if (key) persistPkgKey(key);
      window.location.assign(href);
    });

    function scrollToPkgIndex(idx, behavior) {
      var target = items[idx];
      if (!target) return;
      try {
        target.scrollIntoView({ inline: 'center', block: 'nearest', behavior: behavior || 'smooth' });
      } catch (e) {}
      applyItem(target);
    }

    var pkgTouchStartX = 0;
    var pkgTouchStartY = 0;
    track.addEventListener('touchstart', function (e) {
      if (!e.touches || !e.touches[0]) return;
      pkgTouchStartX = e.touches[0].clientX;
      pkgTouchStartY = e.touches[0].clientY;
    }, { passive: true });

    track.addEventListener('touchend', function (e) {
      var t = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0] : null;
      if (!t) return;
      var dx = t.clientX - pkgTouchStartX;
      var dy = t.clientY - pkgTouchStartY;
      if (Math.abs(dx) < 24 || Math.abs(dx) <= Math.abs(dy)) return;
      var next = dx < 0 ? Math.min(items.length - 1, activePkgIndex + 1) : Math.max(0, activePkgIndex - 1);
      if (next === activePkgIndex) {
        scrollToPkgIndex(activePkgIndex, 'smooth');
        return;
      }
      activePkgIndex = next;
      scrollToPkgIndex(next, 'smooth');
    }, { passive: true });

    window.addEventListener('pageshow', function (ev) {
      if (!ev.persisted) return;
      var key = readSavedPkgKey();
      if (key && itemByKey(key)) restoreSavedPkg();
    });

    window.addEventListener('m2-catalog-loaded', function () {
      var key = readSavedPkgKey();
      if (key && itemByKey(key)) restoreSavedPkg();
    });

    /* IntersectionObserver 检测哪张在视口中央 */
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
          applyItem(entry.target);
        }
      });
    }, { root: track, threshold: 0.5 });

    items.forEach(function (item) { observer.observe(item); });

    restoreSavedPkg();
  })();
  </script>
