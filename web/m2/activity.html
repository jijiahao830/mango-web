  <script>
  (function () {
    var ver = String(typeof window.__MANGO_ASSET_VERSION__ !== 'undefined' ? window.__MANGO_ASSET_VERSION__ : '').trim();

    function stripQueryHash(u) {
      var hash = '';
      var hi = u.indexOf('#');
      if (hi !== -1) {
        hash = u.slice(hi);
        u = u.slice(0, hi);
      }
      var qi = u.indexOf('?');
      if (qi !== -1) u = u.slice(0, qi);
      return { base: u, hash: hash };
    }

    document.querySelectorAll('a.m2-activity-back[href]').forEach(function (a) {
      var p = stripQueryHash(String(a.getAttribute('href') || ''));
      if (!p.base) return;
      var q = ver ? '?v=' + encodeURIComponent(ver) : '';
      a.setAttribute('href', p.base + q + p.hash);
    });

    document.querySelectorAll('a.m2-activity-car[href]').forEach(function (a) {
      var p = stripQueryHash(String(a.getAttribute('href') || ''));
      if (!p.base) return;
      var seg = [];
      if (ver) seg.push('v=' + encodeURIComponent(ver));
      seg.push('m2from=m2activity');
      a.setAttribute('href', p.base + '?' + seg.join('&') + p.hash);
    });

    var pickerImg = document.querySelector('.m2-activity-picker-icon');
    if (pickerImg && ver) pickerImg.src='../media-webp/photos/index/m2/日期.webp?v=' + encodeURIComponent(ver);

    document.querySelectorAll('img.m2-activity-car-cover[src]').forEach(function (img) {
      var u = String(img.getAttribute('src') || '');
      if (!u || !ver) return;
      img.setAttribute('src', u + (u.indexOf('?') === -1 ? '?' : '&') + 'v=' + encodeURIComponent(ver));
    });
  })();
  </script>
