  <script>
  (function () {
    var STORAGE_KEY = 'mangoCarChecklist';
    var btn = document.getElementById('m2ServiceAddBtn');
    var toast = document.getElementById('m2ServiceToast');
    if (!btn) return;

    function readMap() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY) || '{}';
        var obj = JSON.parse(raw);
        return obj && typeof obj === 'object' ? obj : {};
      } catch (e) {
        return {};
      }
    }
    function writeMap(map) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(map || {})); } catch (e) {}
    }
    function activeServiceName() {
      var active = document.querySelector('.carousel-slide.active .slide-title');
      return active ? String(active.textContent || '').trim() : '';
    }
    var toastTimer = null;
    function showToast(text) {
      if (!toast) return;
      toast.textContent = text;
      toast.classList.add('is-show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toast.classList.remove('is-show');
      }, 1300);
    }

    btn.addEventListener('click', function () {
      var name = activeServiceName();
      if (!name) return;
      var id = 'service:' + name;
      var map = readMap();
      if (map[id]) {
        showToast('该服务已添加到用车清单');
        return;
      }
      map[id] = {
        car_id: id,
        car_name: name,
        model_name: name + '（服务）',
        rent_price: 0,
        days: '单日 (24小时)'
      };
      writeMap(map);
      showToast('已添加，可在用车清单中查看');
    });
  })();
  </script>
