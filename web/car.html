<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="media-webp/photos/index/logo/logo2.webp">

  <title>芒果超跑 · 极速出行</title>
  <link rel="stylesheet" href="./car.css">
</head>
<body>

  <!-- 开屏：Pro 片头式动效 + 品牌橙（--brand / --gold-end）；总时长与 car.js 4.5s 一致 -->
  <div class="splash-screen splash-screen--apple splash-screen--keynote-pro" id="splashScreen" aria-hidden="true">
    <div class="splash-bg-apple" aria-hidden="true"></div>
    <div class="splash-spotlight" aria-hidden="true"></div>
    <div class="splash-vignette-apple" aria-hidden="true"></div>
    <div class="splash-floor-glow" aria-hidden="true"></div>
    <div class="splash-pulse-rings" aria-hidden="true">
      <span class="splash-pulse-ring"></span>
      <span class="splash-pulse-ring splash-pulse-ring--delayed"></span>
    </div>
    <div class="splash-content">
      <div class="splash-logo-stage">
        <div class="splash-logo-rim">
          <img src="media-webp/photos/index/logo/logo2.webp" alt="" class="splash-logo-img" decoding="async">
          <div class="splash-logo-rim-sheen" aria-hidden="true">
            <div class="splash-logo-rim-sheen-inner"></div>
          </div>
        </div>
        <div class="splash-stage-line" aria-hidden="true"></div>
        <div class="splash-reflection" aria-hidden="true">
          <div class="splash-logo-rim splash-logo-rim--reflect">
            <img src="media-webp/photos/index/logo/logo2.webp" alt="" class="splash-logo-img splash-logo-img--mirror" decoding="async">
            <div class="splash-logo-rim-sheen splash-logo-rim-sheen--reflect" aria-hidden="true">
              <div class="splash-logo-rim-sheen-inner"></div>
            </div>
          </div>
        </div>
      </div>
      <p class="splash-tagline">芒果超跑 · 极速出行</p>
    </div>
  </div>

  <!-- Header -->
  <header class="site-header">
    <div class="header-left">
      <div class="brand">
        <img src="media-webp/photos/index/logo/logo2-1.webp" alt="芒果超跑" class="brand-logo">
      </div>
    </div>
    <div class="header-center">
      <nav class="header-nav">
        <a href="car.html" style="color: var(--brand);">车辆</a>
        <a href="services.html">服务</a>
        <a href="about.html">关于我们</a>
      </nav>
      <div class="header-logo-dropdown-wrap">
        <button type="button" class="header-logo-menu-btn" id="carHeaderLogoMenuBtn" aria-expanded="false" aria-haspopup="true" aria-controls="carHeaderLogoMenuPanel" aria-label="打开服务与关于菜单">
          <img src="media-webp/photos/index/logo/logo2.webp" alt="" class="brand-logo-center" decoding="async">
        </button>
        <div class="header-logo-menu-panel" id="carHeaderLogoMenuPanel" role="menu" hidden>
          <a role="menuitem" href="services.html">服务</a>
          <a role="menuitem" href="about.html">关于我们</a>
        </div>
      </div>
    </div>
    <div class="header-right">
      <img src="media-webp/photos/index/logo/logo2.webp" alt="芒果超跑标志" class="brand-logo-right" style="height: 32px; width: auto; display: block; margin-right: 20px;">
      <button class="mobile-filter-btn" aria-label="展开筛选" id="mobileFilterBtn">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- 将选车区域顶上去，移除 Hero 相关的 margin -->
  <div class="content-wrapper" id="carSection">
    <div class="car-row">
    <!-- Category Nav -->
    <aside class="sidebar-filter" aria-label="汽车分类">
      <div class="filter-header" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
        <h2 style="margin: 0;">筛选</h2>
        <div style="display: flex; align-items: center; gap: 16px;">
          <span class="filter-result-count" style="margin: 0; font-size: 14px; color: var(--text-muted);">已筛选出 <span id="resultCount">0</span> 种车型</span>
          <button class="close-filter-btn" aria-label="关闭筛选" id="closeFilterBtn">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
      
      <!-- 搜索框 -->
      <div class="filter-search-box" style="margin-bottom: 12px; position: relative;">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); pointer-events: none;">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="carSearchInput" placeholder="搜索车型名称..." style="width: 100%; padding: 12px 16px 12px 40px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.03); color: #fff; font-size: 14px; outline: none; transition: all 0.3s ease;">
      </div>

      <!-- 使用场景 -->
      <div class="filter-group">
        <h3 class="filter-title">使用场景</h3>
        <div class="filter-buttons">
          <button class="filter-btn active" data-scenario="all">全部</button>
          <button class="filter-btn" data-scenario="business">商务</button>
          <button class="filter-btn" data-scenario="wedding">婚庆</button>
          <button class="filter-btn" data-scenario="event">摆展</button>
          <button class="filter-btn" data-scenario="self-drive">自驾</button>
        </div>
      </div>

      <!-- 分类 / 品牌：由 car.js 根据数据库 cars 表动态填充 -->
      <div class="filter-group">
        <h3 class="filter-title">分类</h3>
        <div class="filter-buttons" id="categoryFilterButtons">
          <button class="filter-btn active" data-category="all">全部</button>
        </div>
      </div>

      <div class="filter-group" id="brandFilterGroup">
        <h3 class="filter-title">品牌</h3>
        <div class="filter-buttons" id="brandFilterButtons">
          <button class="filter-btn active" data-brand="all">全部</button>
          <button class="filter-btn expand-btn" id="expandBrandBtn">...</button>
        </div>
      </div>

      <!-- 价格 -->
      <div class="filter-group">
        <h3 class="filter-title">价格</h3>
        <div class="price-range-labels">
          <span id="priceMinLabel">500</span> - <span id="priceMaxLabel">5000</span>
        </div>
        <div class="price-slider-container">
          <div class="slider-track"></div>
          <input type="range" min="500" max="5000" value="500" class="price-slider" id="priceMin">
          <input type="range" min="500" max="5000" value="5000" class="price-slider" id="priceMax">
        </div>
        <div class="price-range-limits">
          <span>500</span>
          <span>5000</span>
        </div>
      </div>

      <button class="reset-btn" id="resetFilterBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="css-i6dzq1"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
        重置
      </button>
    </aside>

    <main class="main-content" id="carGrid">

      <!-- 今日推荐（卡片由 car.js 按库表+点击逻辑填充） -->
      <div class="recommend-section-container" id="recommendSection" data-brand="推荐">
        <h2 class="brand-title" style="color: #ff6b35; display: flex; align-items: center; gap: 8px;">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          今日推荐
        </h2>
        <div class="car-grid"></div>
      </div>

      <!-- 即将上新：category=「即将上新」的车辆，由 car.js 填充 -->
      <div class="recommend-section-container" id="comingSoonSection" data-brand="五菱">
        <h2 class="brand-title" style="color: #38bdf8; display: flex; align-items: center; gap: 8px;">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path><circle cx="12" cy="12" r="3"></circle></svg>
          即将上新
        </h2>
        <div class="car-grid" id="comingSoonGrid"></div>
      </div>

      <p id="carparkCatalogError" class="carpark-catalog-error" style="display:none;padding:16px 24px;color:#f87171;margin:0;"></p>
      <div id="carparkBrandSectionsRoot"></div>

    </main>
    </div>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-brand">芒果超跑</div>
        <div class="footer-copy">© 2026 芒果超跑租车公司 · 极速出行，从这里开始</div>
      </div>
    </footer>
  </div>



  <button type="button" class="back-to-cars-btn" id="backToCarsBtn" aria-label="返回选车区域">
    <svg class="back-to-cars-icon" width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path fill="currentColor" d="M12 5L20 16H4L12 5z"/>
    </svg>
    <span class="back-to-cars-label">返回顶部</span>
  </button>

  <!-- 与 login.html 一致：填写 member_api 根地址后「今日推荐」才能拉取个人点击汇总（留空则仅用价差兜底） -->
  <script>window.MANGO_API_ORIGIN = "";</script>
  <script src="./car.js"></script>
  <script src="./header-logo-menu.js"></script>
  </body>
</html>
