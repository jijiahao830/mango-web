<!doctype html>
<html lang="zh-CN">
<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="format-detection" content="telephone=no">
  <script>window.__MANGO_ASSET_VERSION__='1777545323642';</script>
  <script>
  (function () {
    try {
      var ver = String(typeof window.__MANGO_ASSET_VERSION__ !== 'undefined' ? window.__MANGO_ASSET_VERSION__ : '').trim();
      if (!ver) return;
      var u = new URL(location.href);
      if (u.searchParams.get('v') === ver) return;
      u.searchParams.set('v', ver);
      history.replaceState(null, '', u.toString());
    } catch (e) {}
  })();
  </script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png">

  <title>芒果超跑 · 极速出行</title>
  <link rel="stylesheet" href="./index.css?v=1777545323642">
  <style>
    /* 移除内联样式，因为已经移入独立文件 */
  </style>
</head>
<body>
  <a href="car.html?v=1777545323642#carSection" class="index-floating-logo" aria-label="芒果超跑">
    <img src="media-webp/photos/index/logo/logo2.webp" alt="芒果超跑" />
  </a>
  <div class="index-scrollport">
    <!-- Hero Banner -->
    <section class="hero">
      <div class="hero-video-wrapper">
        <!--
          muted：未静音时 autoplay 常被拦截。
          playsinline / webkit-playsinline：iOS 等内联播放。
          x5-*：微信/QQ 等安卓端腾讯 X5 内核，避免视频独占原生全屏层、盖住页面其它 DOM。
        -->
        <video
          class="hero-video"
          data-src-desktop="media-webp/videos/index/carvideo.mp4"
          data-src-mobile="media-webp/videos/index/carvideo_noaudio.mp4"
          autoplay
          muted
          loop
          preload="auto"
          playsinline="true"
          webkit-playsinline="true"
          x-webkit-airplay="deny"
          x5-playsinline="true"
          x5-video-player-type="h5-page"
          x5-video-player-fullscreen="false"
          x5-video-orientation="portrait"
          disablepictureinpicture
          disableremoteplayback
          controlslist="nodownload noplaybackrate noremoteplayback nofullscreen"
          tabindex="-1"
          aria-hidden="true"
        ></video>
        <div class="hero-video-overlay"></div>
        <div class="hero-noise"></div>
      </div>
      <div class="hero-content">
        <div class="hero-header">
          <div class="hero-eyebrow animate-in" style="--delay: 0.1s">
            RACING COMFORTABLE SINCE 2013 FROM<span class="hero-eyebrow-highlight">芒果超跑&nbsp;</span>
          </div>
          <h1 class="hero-title animate-in" style="--delay: 0.3s">MANGO SUPERCAR</h1>
        </div>
        <div class="hero-actions animate-in" style="--delay: 0.5s">
          <a href="car.html?v=1777545323642#carSection" class="btn-primary btn-lg hero-choose-btn">立即选车</a>
        </div>
      </div>
    </section>
    <!-- 底部信息区：滚入视口时 index.js 暂停背景视频，同时展示备案与联系方式 -->
    <div id="scroll-trigger" class="index-scroll-trigger">
      <div class="index-scroll-trigger__inner">
        <a
          class="index-scroll-trigger__icp"
          href="https://beian.miit.gov.cn/"
          target="_blank"
          rel="noopener noreferrer"
        >滇ICP备2025055273号-3</a>
        <span class="index-scroll-trigger__phone">客服：13033333370</span>
      </div>
    </div>
  </div>

  <script src="./device-redirect.js?v=1777545323642"></script>
  <script>
    (function () {
      function applyCarEntryLinks() {
        if (!window.MangoDeviceRedirect || typeof MangoDeviceRedirect.carEntryHref !== 'function') return;
        var href = MangoDeviceRedirect.carEntryHref();
        document.querySelectorAll('.index-floating-logo, .hero-choose-btn').forEach(function (a) {
          if (a && a.tagName === 'A') a.setAttribute('href', href);
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyCarEntryLinks);
      } else {
        applyCarEntryLinks();
      }
      var resizeT;
      window.addEventListener('resize', function () {
        clearTimeout(resizeT);
        resizeT = setTimeout(applyCarEntryLinks, 200);
      });
    })();
  </script>
  <script src="./index.js?v=1777545323642"></script>
</body>
</html>
